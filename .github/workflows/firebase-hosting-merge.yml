name: Build, Test on merge
'on':
  push:
    branches:
      - main
jobs:
  build_test_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm run test
      - name: Update Coverage Badge
        run: |
          COV=$(jq '[.total | .lines.pct, .statements.pct, .functions.pct, .branches.pct] | min | floor' coverage/coverage-summary.json)
          COLOR=$([ "$COV" -ge 90 ] && echo 'brightgreen' || ([ "$COV" -ge 75 ] && echo 'green' || ([ "$COV" -ge 60 ] && echo 'yellow' || echo 'red')))
          echo "{\"schemaVersion\":1,\"label\":\"coverage\",\"message\":\"${COV}%\",\"color\":\"${COLOR}\"}" > coverage-badge.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add coverage-badge.json
          git diff --staged --quiet || (git commit -m 'Update coverage badge [skip ci]' && git push)
      - name: Install functions dependencies
        run: npm ci --prefix functions
      - name: Create functions env file
        run: echo "MONGODB_URL=${{ secrets.MONGODB_URL }}" > functions/.env
      - name: Deploy to Firebase Functions
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_NUTRITION_3236D }}' > /tmp/sa.json
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json npx firebase-tools deploy --only functions --project nutrition-3236d
